<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Doctor Approvals</title>
    
    <style>
        /* Center content */
        .container {
            width: 80%;
            margin: 30px auto;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Style the table */
        .doctor-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Table headers */
        .doctor-table th {
            background: #007bff;
            color: white;
            padding: 12px;
            font-size: 16px;
        }

        /* Table rows */
        .doctor-table td {
            padding: 12px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        /* Alternate row colors */
        .doctor-table tbody tr:nth-child(even) {
            background: #f8f9fa;
        }

        /* Buttons */
        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }

        /* Approve Button */
        .approve-btn {
            background: #28a745;
            color: white;
        }

        /* Reject Button */
        .reject-btn {
            background: #dc3545;
            color: white;
        }

        /* Hover Effects */
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pending Doctor Approvals</h2>
        <table class="doctor-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>License Number</th>
                    <th>Date of Birth</th> <!-- ✅ Updated Label -->
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="doctorList">
                <!-- Doctors will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        const apiBaseUrl = "https://enfocare-service-production.up.railway.app/admin";

        async function loadDoctors() {
            try {
                const response = await fetch(`${apiBaseUrl}/pending-doctors`);
                const doctors = await response.json();

                const tableBody = document.getElementById('doctorList');
                tableBody.innerHTML = ''; // Clear table

                doctors.forEach(doctor => {
                    const formattedDOB = doctor.birthday ? new Date(doctor.birthday).toLocaleDateString() : "N/A";

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${doctor.firstname} ${doctor.lastname}</td>
                        <td>${doctor.email}</td>
                        <td>${doctor.licenseNumber || "Not Assigned"}</td>
                        <td>${formattedDOB}</td> <!-- ✅ Shows formatted Date of Birth -->
                        <td>
                            <button class="approve-btn" onclick="approveDoctor('${doctor.email}')">Approve</button>
                            <button class="reject-btn" onclick="rejectDoctor('${doctor.email}')">Reject</button>
                        </td>
                    `;

                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error loading doctors:", error);
            }
        }

        async function approveDoctor(email) {
            let licenseNumber = prompt(`Enter License Number for ${email}:`);
            if (!licenseNumber) {
                alert("Approval cancelled.");
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/approve-doctor/${email}?licenseNumber=${licenseNumber}`, { 
                    method: "PUT"
                });

                const result = await response.text();
                alert(result);
                loadDoctors(); // Reload the list after approval
            } catch (error) {
                console.error("Error approving doctor:", error);
                alert("Failed to approve doctor.");
            }
        }

        async function rejectDoctor(email) {
            if (!confirm(`Are you sure you want to reject ${email}?`)) {
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/reject-doctor/${email}`, { 
                    method: "PUT"
                });

                const result = await response.text();
                alert(result);
                loadDoctors(); // Reload the list after rejection
            } catch (error) {
                console.error("Error rejecting doctor:", error);
                alert("Failed to reject doctor.");
            }
        }

        document.addEventListener("DOMContentLoaded", loadDoctors);
    </script>

</body>
</html>
